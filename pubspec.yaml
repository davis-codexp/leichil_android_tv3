name: leichil_android_tv
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: ^10.3.1
  fluttertoast: ^9.1.0
  pinput: ^5.0.1
  video_player: ^2.13.0
  url_launcher: ^6.3.0
  intl: ^0.20.3
  google_fonts: ^6.3.2
  screen_brightness: ^2.1.11
  volume_controller: ^3.7.1
  cached_network_image: ^3.4.1
  palette_generator: ^0.3.3+7
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

  assets:
    - assets/images/leichil_logo.webp
    - assets/images/leichil_logo_text.webp
    - assets/images/leichil_logo_black.png
    - assets/images/leichil_logo_text_black.png
    - assets/images/leichil_logo_native.png
    - assets/images/leichil_logo_android12.png
    - assets/images/favicon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/launcher/leichil_icon.png"
  min_sdk_android: 21
